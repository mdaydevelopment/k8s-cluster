---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-bedrock-backup
  namespace: minecraft-bedrock
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: freenas-iscsi-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
