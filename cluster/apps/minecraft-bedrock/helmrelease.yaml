---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-bedrock
  namespace: minecraft-bedrock
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      minecraft-bedrock:
        initContainers:
          restore-backup:
            image:
              repository: alpine
              tag: "3.20"
            command: ["sh", "-c"]
            args:
              - |
                apk add --no-cache rsync >/dev/null
                if [ -z "$(ls -A /data/worlds 2>/dev/null)" ]; then
                  echo "world data empty, restoring latest backup..."
                  rsync -a /backup/ /data/
                else
                  echo "world data present, skipping restore"
                fi
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 100m
                memory: 128Mi
        containers:
          app:
            image:
              repository: itzg/minecraft-bedrock-server
              tag: latest
            env:
              EULA: "TRUE"
              TZ: "America/Chicago"
              SERVER_NAME: "Homelab Bedrock"
              LEVEL_NAME: "world"
              GAMEMODE: survival
              DIFFICULTY: normal
              MAX_PLAYERS: "10"
              # xbox live auth — do not disable.
              ONLINE_MODE: "true"
              ALLOW_LIST: "true"
              ALLOW_LIST_USERS: "${MINECRAFT_ALLOW_LIST_USERS}"
              # operator/superuser permissions — gamertag[:xuid], comma-separated
              OPS: ${quote}${MINECRAFT_OPS}${quote}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 4
                memory: 4Gi
              limits:
                cpu: 4
                memory: 4Gi
      minecraft-bedrock-backup:
        type: cronjob
        cronjob:
          schedule: "0 * * * *"
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: alpine
              tag: "3.20"
            command: ["sh", "-c"]
            args:
              - |
                apk add --no-cache rsync >/dev/null
                rsync -a --delete /data/ /backup/
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 512Mi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: stargazer
    service:
      app:
        controller: minecraft-bedrock
        type: LoadBalancer
        labels:
          lb_pool: reserved
        annotations:
          lbipam.cilium.io/ips: "192.168.86.65"
        ports:
          minecraft:
            enabled: true
            primary: true
            protocol: UDP
            port: 19132
    ingress:
      app:
        enabled: false
    persistence:
      data:
        enabled: true
        type: hostPath
        hostPath: /var/lib/minecraft-bedrock
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /data
      backup:
        enabled: true
        existingClaim: minecraft-bedrock-backup
        globalMounts:
          - path: /backup
