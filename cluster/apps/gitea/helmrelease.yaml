---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      gitea:
        initContainers:
          wait-for-valkey:
            image:
              repository: busybox
              tag: "1.37"
            command:
              - sh
              - -c
              - |
                until nc -z gitea-valkey.gitea.svc.cluster.local 6379; do
                  echo "waiting for valkey..."; sleep 2
                done
          wait-for-db:
            image:
              repository: busybox
              tag: "1.37"
            command:
              - sh
              - -c
              - |
                until nc -z gitea-cnpg-cluster-rw.gitea.svc.cluster.local 5432; do
                  echo "waiting for postgres..."; sleep 2
                done
        containers:
          app:
            image:
              repository: gitea/gitea
              tag: latest
            env:
              TZ: America/Chicago
              GITEA__database__DB_TYPE: postgres
              GITEA__database__HOST: gitea-cnpg-cluster-rw.gitea.svc.cluster.local:5432
              GITEA__database__NAME:
                valueFrom:
                  secretKeyRef:
                    name: gitea-cnpg-cluster-app
                    key: dbname
              GITEA__database__USER:
                valueFrom:
                  secretKeyRef:
                    name: gitea-cnpg-cluster-app
                    key: username
              GITEA__database__PASSWD:
                valueFrom:
                  secretKeyRef:
                    name: gitea-cnpg-cluster-app
                    key: password
              GITEA__server__DOMAIN: "gitea.${SECRET_DOMAIN_A}"
              GITEA__server__ROOT_URL: "https://gitea.${SECRET_DOMAIN_A}"
              GITEA__server__HTTP_PORT: "3000"
              GITEA__server__DISABLE_SSH: "true"
              GITEA__service__DISABLE_REGISTRATION: "true"
              GITEA__cache__ENABLED: "true"
              GITEA__cache__ADAPTER: redis
              GITEA__cache__HOST: "redis://gitea-valkey.gitea.svc.cluster.local:6379"
              GITEA__queue__TYPE: redis
              GITEA__queue__CONN_STR: "redis://gitea-valkey.gitea.svc.cluster.local:6379"
              GITEA__session__PROVIDER: redis
              GITEA__session__PROVIDER_CONFIG: "redis://gitea-valkey.gitea.svc.cluster.local:6379"
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 3000
    ingress:
      main:
        enabled: true
        className: "nginx"
        labels:
          external-dns-cloudflare: enable
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          hajimari.io/enable: "true"
          hajimari.io/icon: "simple-icons:gitea"
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
        hosts:
        - host: "gitea.${SECRET_DOMAIN_A}"
          paths:
          - path: /
            pathType: Prefix
        tls:
        - hosts:
          - "gitea.${SECRET_DOMAIN_A}"
          secretName: gitea-tls
    persistence:
      data:
        existingClaim: gitea-data
        globalMounts:
          - path: /data
