---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: studylion-cnpg-cluster
  namespace: studylion
spec:
  instances: 1
  bootstrap:
    initdb:
      database: lion_data
      owner: lionbot
  storage:
    storageClass: freenas-iscsi-csi
    size: 5Gi
  backup:
    volumeSnapshot:
      className: freenas-iscsi-delete
      snapshotOwnerReference: backup
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: studylion-cnpg-metrics
  namespace: studylion
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: studylion-cnpg-cluster
  podMetricsEndpoints:
    - port: metrics
